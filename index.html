<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>English Fun! 🦉 — Choisis ton chapitre</title>
  <link rel="stylesheet" href="chapters/basic/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>">
  <style>
    .chapter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:8px}
    .chapter-card{display:flex;gap:16px;align-items:center;text-align:left;border:none;cursor:pointer;padding:20px;
      border-radius:26px;background:#fff;box-shadow:0 10px 0 rgba(43,35,80,.12),0 18px 30px rgba(43,35,80,.14);
      border:3px solid #ffe3ec;font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',sans-serif;transition:transform .12s}
    .chapter-card:hover{transform:translateY(-4px) rotate(-.6deg)}
    .chapter-card.soon{opacity:.55;cursor:not-allowed;filter:grayscale(.7)}
    .cc-icon{font-size:52px;width:80px;height:80px;display:grid;place-items:center;border-radius:22px;background:#f6f3ff}
    .cc-title{font-size:22px;font-weight:800;color:#2b2350;display:block}
    .cc-sub{font-size:14px;color:#5a5180;display:block;margin-top:4px}
    .cc-soon{display:inline-block;margin-top:6px;font-size:12px;background:#fff3cd;color:#7a5b00;padding:3px 10px;border-radius:999px}
  </style>
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <span class="float f1">☁️</span><span class="float f2">🌈</span><span class="float f3">⭐</span>
    <span class="float f4">🎈</span><span class="float f5">📚</span><span class="float f6">✏️</span>
  </div>
  <header class="appbar">
    <button class="btn home" id="btn-home">🦉 English Fun</button>
    <div class="appbar-right"><span class="voice-status" id="voice-status"></span></div>
  </header>
  <main class="screen">
    <div class="hero">
      <div class="hero-emoji">🦉</div>
      <div>
        <h1 class="hero-title">English Fun!</h1>
        <p class="hero-sub">Choisis ton chapitre, puis ton niveau. Bon apprentissage !</p>
      </div>
    </div>
    <div class="chapter-grid">
      <button class="chapter-card" data-href="chapters/basic/index.html">
        <span class="cc-icon">🌱</span>
        <span><span class="cc-title">Chapitre 1 — Les bases</span>
        <span class="cc-sub">Hello, couleurs, animaux, verbes… jusqu’à construire des phrases. 8 niveaux.</span></span>
      </button>
      <button class="chapter-card soon" disabled>
        <span class="cc-icon">🗺️</span>
        <span><span class="cc-title">Chapitre 2 — L’aventure</span>
        <span class="cc-sub">Famille, jours, heure, météo, à l’école, ville, corps & sentiments, et le grand quiz. Bientôt !</span>
        <span class="cc-soon">en préparation</span></span>
      </button>
    </div>
  </main>
  <footer class="appfoot">Fait avec ❤️ pour apprendre l'anglais · chaque mot est prononcé quand tu cliques 🔊</footer>
  <script>document.querySelectorAll('.chapter-card[data-href]').forEach(b=>b.addEventListener('click',()=>location.href=b.dataset.href));</script>
</body>
</html>
